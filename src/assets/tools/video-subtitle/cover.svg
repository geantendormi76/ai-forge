<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- 极夜深空背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101718" />
      <stop offset="50%" stop-color="#142124" />
      <stop offset="100%" stop-color="#0a0f10" />
    </linearGradient>

    <!-- 中心电光海青聚光晕 -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#02c3b4" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#02c3b4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- 紫电流光渐变 -->
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#02c3b4" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#02c3b4" stop-opacity="1" />
      <stop offset="50%" stop-color="#00d2ff" stop-opacity="1" />
      <stop offset="70%" stop-color="#bc05ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#02c3b4" stop-opacity="0.2" />
    </linearGradient>

    <!-- 柔和光学辉光滤镜 -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feComposite in="SourceGraphic" in2="blur2" operator="over" />
    </filter>
  </defs>

  <!-- 1. 底板画卷 (16:10 黄金比例) -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- 2. 核心光学聚光层 -->
  <rect width="800" height="500" fill="url(#centerGlow)" />

  <!-- 3. 背景参数化几何点阵 -->
  <g opacity="0.12" fill="#02c3b4">
    <circle cx="100" cy="80" r="1.5" /><circle cx="250" cy="80" r="1.5" /><circle cx="400" cy="80" r="1.5" /><circle cx="550" cy="80" r="1.5" /><circle cx="700" cy="80" r="1.5" />
    <circle cx="100" cy="180" r="1.5" /><circle cx="250" cy="180" r="1.5" /><circle cx="400" cy="180" r="1.5" /><circle cx="550" cy="180" r="1.5" /><circle cx="700" cy="180" r="1.5" />
    <circle cx="100" cy="280" r="1.5" /><circle cx="250" cy="280" r="1.5" /><circle cx="400" cy="280" r="1.5" /><circle cx="550" cy="280" r="1.5" /><circle cx="700" cy="280" r="1.5" />
    <circle cx="100" cy="380" r="1.5" /><circle cx="250" cy="380" r="1.5" /><circle cx="400" cy="380" r="1.5" /><circle cx="550" cy="380" r="1.5" /><circle cx="700" cy="380" r="1.5" />
  </g>

  <!-- 4. 抽象电影声波流光曲线 -->
  <g filter="url(#neonBlur)" opacity="0.75">
    <path d="M 50 250 C 180 160, 240 340, 360 220 C 460 120, 540 380, 640 230 C 700 160, 750 250, 750 250" 
          fill="none" stroke="url(#streamGrad)" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- 5. 核心声波频段粒子阵列 -->
  <g filter="url(#subtleGlow)" opacity="0.95">
    <!-- 左翼渐进区 -->
    <rect x="120" y="225" width="5" height="50" rx="2.5" fill="#02c3b4" />
    <rect x="145" y="200" width="5" height="100" rx="2.5" fill="#02c3b4" />
    <rect x="170" y="170" width="5" height="160" rx="2.5" fill="#02c3b4" />
    <rect x="195" y="210" width="5" height="80" rx="2.5" fill="#02c3b4" />
    <rect x="220" y="150" width="5" height="200" rx="2.5" fill="#00d2ff" />
    <rect x="245" y="180" width="5" height="140" rx="2.5" fill="#02c3b4" />
    <rect x="270" y="220" width="5" height="60" rx="2.5" fill="#02c3b4" />

    <!-- 黄金中枢区 -->
    <rect x="300" y="160" width="6" height="180" rx="3" fill="#bc05ff" />
    <rect x="330" y="120" width="6" height="260" rx="3" fill="#02c3b4" />
    <rect x="360" y="80"  width="7" height="340" rx="3.5" fill="#00ffa9" />
    <rect x="395" y="105" width="8" height="290" rx="4" fill="#ffffff" />
    <rect x="430" y="80"  width="7" height="340" rx="3.5" fill="#00ffa9" />
    <rect x="465" y="120" width="6" height="260" rx="3" fill="#02c3b4" />
    <rect x="495" y="160" width="6" height="180" rx="3" fill="#bc05ff" />

    <!-- 右翼收敛区 -->
    <rect x="525" y="220" width="5" height="60" rx="2.5" fill="#02c3b4" />
    <rect x="550" y="180" width="5" height="140" rx="2.5" fill="#02c3b4" />
    <rect x="575" y="150" width="5" height="200" rx="2.5" fill="#00d2ff" />
    <rect x="600" y="210" width="5" height="80" rx="2.5" fill="#02c3b4" />
    <rect x="625" y="170" width="5" height="160" rx="2.5" fill="#02c3b4" />
    <rect x="650" y="200" width="5" height="100" rx="2.5" fill="#02c3b4" />
    <rect x="675" y="225" width="5" height="50" rx="2.5" fill="#02c3b4" />
  </g>
</svg>
