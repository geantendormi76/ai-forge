[package]
name = "core-security"
version = "0.1.0"
edition = "2021"

[dependencies]
sysinfo = "0.30"
mac_address = "1.1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
reqwest = { version = "0.12", features = ["json"] }
ed25519-dalek = "2.1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
wmi = "0.13"
winreg = "0.52"
