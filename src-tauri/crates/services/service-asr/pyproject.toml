[project]
name = "service-asr"
version = "0.1.0"
description = "AI-Forge - MOSS-Transcribe-Diarize 0.9B Speech Shared Service Sandbox"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "transformers>=4.40.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.0",
    "av>=11.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "socksio>=1.0.0",
    "httpx-socks>=0.8.0",
    "meeteval>=0.4.0",
    "whisper-normalizer>=0.0.3",
    "accelerate>=0.28.0",
    "scipy>=1.10.0"
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[tool.uv]
package = false
