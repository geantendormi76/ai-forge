edition = "2021"

[lib]
name = "service_asr"
path = "src/lib.rs"

[dependencies]
shared-contracts = { path = "../../shared-contracts" }
llama-cpp-2 = { path = "C:/dev/github/llama-cpp-rs/llama-cpp-2", features = ["cuda"] }
