[package]
name = "service-asr"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "service_asr"
path = "src/lib.rs"

[dependencies]
shared-contracts = { path = "../../shared-contracts" }
transcribe-cpp = { path = "C:/dev/github/transcribe.cpp/bindings/rust/transcribe-cpp", features = ["cuda"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
hound = "3.5"
