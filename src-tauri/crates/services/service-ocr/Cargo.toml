[package]
name = "service-ocr"
version = "0.1.0"
edition = "2024"

[lib]
name = "service_ocr"
path = "src/lib.rs"

[features]
default = []
cuda = ["core-onnx-infer/cuda"]
simd = []

[dependencies]
shared-contracts = { path = "../../shared-contracts" }
core-onnx-infer = { path = "../../core-onnx-infer" }
ndarray = "0.15"
image = "0.25"
imageproc = "0.25"
clipper2-rust = "1.1"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
