[package]
name = "service-translation"
version = "0.1.0"
edition = "2021"

[lib]
name = "service_translation"
path = "src/lib.rs"

[dependencies]
core-ipc = { path = "../../core-ipc" }
shared-contracts = { path = "../../shared-contracts" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1.38", features = ["full"] }
