[package]
name = "service-upscale"
version = "0.1.0"
edition = "2021"

[dependencies]
core-models-download = { path = "../../core-models-download" }
core-onnx-infer = { path = "../../core-onnx-infer", features = ["cuda"] }
shared-contracts = { path = "../../shared-contracts" }
ort = { version = "2.0.0-rc.9", features = ["cuda"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
fast_image_resize = { version = "5.1", features = ["image"] }
ndarray = "0.15"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1.38", features = ["sync", "rt", "macros", "rt-multi-thread"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
