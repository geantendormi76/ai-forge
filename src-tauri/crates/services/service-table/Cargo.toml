[package]
name = "service-table"
version = "0.1.0"
edition = "2021"

[lib]
name = "service_table"
path = "src/lib.rs"

[dependencies]
core-onnx-infer = { path = "../../core-onnx-infer" }
ndarray = "0.15"
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
