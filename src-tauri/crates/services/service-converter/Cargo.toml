[package]
name = "service-converter"
version = "0.1.0"
edition = "2021"

[lib]
name = "service_converter"
path = "src/lib.rs"

[dependencies]
aes = "0.8"
cbc = "0.1"
ecb = "0.1"
cipher = { version = "0.4", features = ["block-padding"] }
md-5 = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
byteorder = "1.5"
flate2 = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1.38", features = ["macros", "rt-multi-thread"] }
