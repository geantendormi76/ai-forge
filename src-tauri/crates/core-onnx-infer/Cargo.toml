[package]
name = "core-onnx-infer"
version = "0.1.0"
edition = "2021"

[lib]
name = "core_onnx_infer"
path = "src/lib.rs"

[features]
default = ["cuda"]
cuda = ["ort/cuda"]
directml = ["ort/directml"]
coreml = ["ort/coreml"]

[dependencies]
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic", "cuda", "std", "ndarray", "tracing", "api-20"] }
ndarray = "0.15"
thiserror = "2"
tracing = "0.1"
log = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate", "lzma"] }
