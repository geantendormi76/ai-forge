[package]
name = "format-converter"
version = "0.1.0"
edition = "2021"

[lib]
name = "format_converter"
path = "src/lib.rs"

[dependencies]
service-converter = { path = "../../services/service-converter" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1.38", features = ["full"] }

[dev-dependencies]
tokio = { version = "1.38", features = ["macros", "rt-multi-thread"] }
