[package]
name = "tool-pdf-parse"
version = "0.1.0"
edition = "2021"

[lib]
name = "tool_pdf_parse"
path = "src/lib.rs"

[dependencies]
service-doc-parse = { path = "../../services/service-doc-parse" }
service-pdfium = { path = "../../services/service-pdfium" }
shared-contracts = { path = "../../shared-contracts" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
lopdf = "0.34"
tokio = { version = "1.38", features = ["full"] }
image = "0.25"
zip = { version = "2.1", default-features = false, features = ["deflate"] }

[features]
default = []
cuda = []
