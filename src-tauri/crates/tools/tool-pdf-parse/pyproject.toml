[project]
name = "tool-pdf-parse"
version = "0.1.0"
description = "AI Toolkit - PDF Parse & Formula Recognition Sandbox"
requires-python = ">=3.10,<3.13"
dependencies = [
    "paddlepaddle-gpu>=3.0.0b1",
    "paddleocr>=2.7.0",
    "paddlex>=3.0.0",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.1",
    "tokenizers>=0.15.0",
    "regex>=2023.10.0",
    "scipy>=1.10.0",
    "ftfy>=6.0.0",
    "sympy>=1.12",
    "albumentations>=1.3.0",
    "huggingface-hub>=0.20.0",
    "modelscope>=1.12.0",
    "onnxruntime-gpu>=1.18.0,<1.20.0",
    "socksio>=1.0.0",
    "httpx-socks>=0.8.0",
]

[[tool.uv.index]]
name = "paddle-gpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu123/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-gpu" }

[tool.uv]
package = false
# 🛡️ 核心黑科技 (PEP 508 规范): 彻底屏蔽 CPU 版 onnxruntime 被隐式拉取！
override-dependencies = [
    "onnxruntime; sys_platform == 'never'",
]
