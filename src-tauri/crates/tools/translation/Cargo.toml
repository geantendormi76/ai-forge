[package]
name = "translation"
version = "0.1.0"
edition = "2021"

[lib]
name = "translation"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio = { version = "1.38", features = ["full"] }
thiserror = "2"
image = "0.25"
base64 = "0.22"
shared-contracts = { path = "../../shared-contracts" }
service-translation = { path = "../../services/service-translation" }
service-ocr = { path = "../../services/service-ocr" }
core-models-download = { path = "../../core-models-download" }
